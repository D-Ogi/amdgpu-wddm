    detail: "The slice is benchmark seconds 31.083 to 59.0, cut short because the runner's thermal rule stopped the session 41 s into the benchmark at 88.8 C. Frame rate is NOT comparable between the two sessions: 436 ran at a 1430 MHz mean against 1107 MHz in 429, because the higher busy share crossed the DPM raise threshold. Read a rate per GHz or not at all. The result does not clear the remaining 0.501 long stalls a second, and it does not price our own completion hop, which a separate conjecture puts at about 0.03 ms of a 70 Hz frame. An audit for the next release found the product rule already broken in one shipped script and three lab tools, so the rule needs a gate"
    evidence: "[Off-GPU frame cost, C48 to C55](research/offgpu-frame-cost-c48-c55.md)"
