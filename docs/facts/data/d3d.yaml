    status: MEASURED
    date: "2026-09-28"
    claim: "What the shadow of M792 reaches in the System32 binaries of this Windows build (`dxgi` 10.0.26100.9444, `d3d11`, `dcomp` and `d3d12` 10.0.26100.9278), read from the binaries and confirmed by the runtime import reports of E56. System32 `d3d11.dll` has exactly one static `dxgi` import, `CreateDXGIFactory2`, with its import address table at 0x1801EBD30. At device creation `d3d11` calls `GetModuleHandleA` for the name DXGI and then `GetProcAddress` for `CompatValue`, at 0x180008C21 to 0x180008C3E through the import slots 0x1801EB8A8 and 0x1801EB8C0. The app-local DXVK `dxgi.dll` exports five names only, so `CompatValue` resolves to nothing under the shadow and `d3d11` keeps its own defaults. `d3d11` delay-imports `d3d11on12.dll!OpenAdapter_D3D11On12`, and System32 `dcomp` delay-imports `CreateDXGIFactory1`, `CreateDXGIFactory2` and `D3D11CreateDevice`. All of those stay unresolved through the whole route. System32 `dxgi` holds bare-name `LoadLibraryW` call sites for `d3d11.dll` at 0x18002876C and 0x1800A14C9 and for `d3d12.dll` at 0x18009482D, and the 17 distinct loader calls the route makes from System32 graphics modules reach none of them"
