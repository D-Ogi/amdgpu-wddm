  - id: M792
    status: MEASURED
    date: "2026-09-28"
    claim: "An app-local DXVK `dxgi.dll` shadows the System32 one for the System32 modules a Vulkan WSI loads, and the shadow breaks exactly one call (E56, six harness modes, development PC, Windows 10.0.26200, NVIDIA user-mode driver). In a process that first loaded DXVK 3.1.1 `dxgi.dll` (`2E674A56`) by name, System32 `d3d11.dll` loaded afterwards by full path binds its only static `dxgi` import, `CreateDXGIFactory2`, to the app-local DLL, and `GetModuleHandleW` for the name `dxgi.dll` answers with the app-local DLL as well. A D3D11 device on an explicit adapter from the System32 factory still works, and its factory, adapter, device, `IDXGIDevice`, NT and KMT shared textures and shared `ID3D11Fence` are all implemented in System32. Only `D3D11CreateDevice` with a NULL adapter fails. It enters the DXVK factory, DXVK builds a Vulkan instance and reports the GPU as 1002:73df, DXVK refuses the private interface query of `d3d11`, and the call returns 0x8000FFFF with exception 0xC0000005. `LOAD_LIBRARY_SEARCH_SYSTEM32` on the load of `d3d11` does not change that result"
    status_text: "MEASURED (development PC, not unit A)"
    detail: "Three mitigations make the NULL-adapter device work, and none of them is usable as it stands. Rewriting the import tables of System32 `d3d11` (1 slot) and `dcomp` (5 slots) to System32 works. An activation context that holds a `loadFrom` to System32 works, but the attribute is undocumented. Loading System32 `dxgi` before the name is used works, and a game loads its own DLLs before our code runs, so that order is not ours to pick. The rule this gives the WSI is to never create a D3D11 device with a NULL adapter, to take the adapter from the System32 factory through `EnumAdapterByLuid`, and to use driver type UNKNOWN. Measured against the NVIDIA user-mode driver with no window, so nothing here is evidence about our own driver"
    evidence: "[E56, shadowtest](../evidence/windows/2026-09-28-E56-dxgi-shadowing-dev-pc/README.md)"
    edges:
      - {"type": "uses", "to": "M496"}
      - {"type": "uses", "to": "M571"}
  - id: M793
    status: MEASURED
    date: "2026-09-28"
    claim: "The DXGI composition present route that a Vulkan WSI needs passes beside app-local DXVK and vkd3d-proton DLLs, so the plan needs no copy of any System32 DLL (E56, six modes, development PC, 2026-09-28). The route is a System32 `CreateDXGIFactory2`, `EnumAdapterByLuid` on the wanted LUID, a presenter and a producer D3D11 device on that adapter, an NT shared BGRA8 texture, a cross-device shared fence, `DCompositionCreateDevice` with a visual, `CreateSwapChainForComposition` (FLIP_SEQUENTIAL, two buffers), four frames of `CopyResource` and `Present1(1,0)` against the fence, `ResizeBuffers` to 320x200, and one `ALLOW_TEARING` swap chain with `Present1(0, ALLOW_TEARING)`. It passes in a clean directory, beside DXVK `d3d11` (`41CE2364`) and `dxgi` (`F593D6C2`), and beside DXVK `dxgi` (`2E674A56`) with vkd3d-proton `d3d12` (`7B77ED5C`) and `d3d12core` (`90B1DAD6`), each of the three without and with a seal policy. Every mode exits 0 in 0.28 s to 0.33 s, no mode produced a DXVK log, frame 0 reads back BGRA 191,127,64,255 against the expected 191,128,64,255, and the view the game has of its own modules does not change. `CreateSwapChainForComposition` and `Present1` are implemented by System32 `dxgi` in every shadowed mode"
    status_text: "MEASURED (development PC, not unit A)"
    detail: "Contacts with the app-local DLL per mode: 0 in both clean modes, 5 beside DXVK d3d11 and 3 beside vkd3d-proton without the seal, 2 and 0 with it. Of the 5, two belong to the game's own DXVK `d3d11` and two are the latent `CreateDXGIFactory2` binding of System32 `d3d11`, which the route never calls. The one real contact is `GetModuleHandleA` for the name DXGI from System32 `d3d11` at device creation, which the seal redirects to System32. The seal rewrites the import tables of the System32 graphics modules to System32 modules that are already loaded, redirects bare-name loader calls made from those modules, and loads nothing itself. It stays an opt-in policy, because the route passes without it. An earlier harness run is kept as a lesson only. It loaded `d3d11on12.dll` eagerly, which bound to the DXVK `dxgi` in one scenario and failed in the other, so the WSI must never force-load `d3d11on12` or System32 `d3d12` in a game process. Limits: the NVIDIA user-mode driver, no window and therefore no `CreateTargetForHwnd`, synthetic application directories and not a real game, and `Present1(1,0)` at 5.8 ms to 6.4 ms is the vsync pace of this machine and says nothing about unit A"
    evidence: "[E56, presenttest](../evidence/windows/2026-09-28-E56-dxgi-shadowing-dev-pc/README.md)"
