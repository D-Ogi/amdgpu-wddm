  - id: M797
    status: MEASURED
    date: "2026-10-06"
    claim: "The long idle gaps of the 3D ring (node 0) in game sessions 418, 419 and 420 are a refusal in dxgkrnl's software ready set, not a missing wake-up and not a gap in our completion path. Conjecture C48 (the next packet waits for the VSync interrupt's DPC) dies on clause 1 of its own pre-registered kill rule in 418 of 418 stalls of session 418: dxgkrnl's scheduler worker thread dispatches the packet that ends the stall, a median 121 us after the VSync interrupt and 108 us after the VSync DPC, so no DPC dispatched it. Our kernel driver reports `DXGK_INTERRUPT_DMA_COMPLETED` for 100 % of the 19694 gap boundaries and retires exactly one packet per report. What follows is dxgkrnl: the completion sets the stalling context to status `0x0000000a` (never at a fast boundary, 0 of 16593), the scheduler worker wakes a median 19 us later and its node-0 `SelectContext2` reports `ReadyNodeSwMapBits` bit 0 CLEAR while `ReadyNodeHwMapBits` bit 0 is SET, it selects nothing and parks on the VSync event, and an adapter-wide context-status sweep after the VSync sets the context to `0x00000005` a median 23 us before the submit (404 of 418). The stall holds a dispatchable packet for 95.4 % to 96.9 % of its length, a median 8 ms, and the class costs 0.45 ms to 0.67 ms of each frame"
    status_text: "MEASURED (unit A, offline read of three recorded sessions, pre-registered kill rule)"
    detail: "Four other explanations died in the same read: the stalling context held a full scheduler quantum at the completion in 276 of 276 records and never 0, the hardware ready map said node 0 was free, no DMA ran on another node, and no wait was outstanding. The read is offline over the recorded ETW packet streams of sessions 418, 419 and 420, with no lab access and no new capture. The tail holds 39.5 % to 47.5 % of all node-0 idle in the three sessions. This row says what the stall is. It does not name the client that causes it: that is M798 and M799"
    evidence: "[Off-GPU frame cost, C48 to C55](research/offgpu-frame-cost-c48-c55.md)"
  - id: M798
    status: HYPOTHESIS
    date: "2026-10-06"
    claim: "The refusal of M797 looks like the effect of a `D3DKMTEscape` with `Flags.HardwareAccess = 1`, which makes dxgkrnl suspend the whole GPU scheduler. While the suspend is in force, a DMA completion parks the game's context at status `0x0a` instead of making it ready, and only the escape's resume lifts it. One such escape can cost up to one VSync period, because dxgmms2's suspend path submits two global commands that only its VSync-paced worker retires. Our own escape handler is not the cost: over the long holds it runs for less than 1 % of the hold and waits for dxgmms2's worker in 167 of 168 cases. In session 430 the suspending client was the lab's own overlay poll, six `bc250kmd_cli.exe` children of `bc250mon.exe`, one every 5.8 s to 6.4 s, each issuing 131 to 191 Level Two escapes, and 200 of 239 long stalls plus 112 of 113 VSync-ended ones fell inside those six spans (14.2 % of the window)"
    status_text: "HYPOTHESIS (the capture's pre-registered control FAILED, so the stacked window is not evidence)"
    detail: "The capture that produced this read is `etw-capture.ps1 -SchedulerStacks` (`tools/win/lab-runner/etw`) in session 430. Its pre-registered control failed: the VSync-ended share of long stalls was 0.473 against 0.904 in the plain control 429, which is -47.7 % against a 20 % bound, and the failure held at every slice shift from -3 s to +3 s. The median long-stall gap (-8.6 %) and the stall rate both passed. The instrument delays the recorded end of a stall by about 180 us, which pushes 37 % of the stalls past the 300 us classifier. At a 1 ms classifier the two sessions agree within 9.2 %. It also costs rate, 69.35 frames a second in the slice against 74.23. By the capture plan's own text the stacks are therefore not evidence, so no number of this row may be quoted as a result. The read itself is consistent across three independent passes and four skeptic rebuilds. The lab test that admitted the conclusion is M799. One lever is already dead: capping the poll inside our own Level Two handler cannot help, because the handshake belongs to dxgkrnl and not to us"
    evidence: "[Off-GPU frame cost, C48 to C55](research/offgpu-frame-cost-c48-c55.md)"
    edges:
      - {"type": "uses", "to": "M797"}
  - id: M799
    status: MEASURED
    date: "2026-10-06"
    claim: "Stopping the lab overlay's summary poll removes the VSync-ended long-stall class of M797 on unit A. In session 436 (release 0.7.208.100-tester.13, the poll paused and the stale lab copy of `bc250kmd_cli.exe` replaced by the release tool), over the pre-registered slice: the escape-hold marker packets are 0.00/s against 51.72/s in session 429, long node-0 stalls are 0.501/s against 5.301/s, none of them end at a VSync against 0.892/s, and the ring is busy 96.2 % of the window against 92.0 %. So the class that C48 and C49 set out to explain was the lab's own instrument. The product rule that follows is that no shipped component may poll the driver with `HardwareAccess` while a game can run"
