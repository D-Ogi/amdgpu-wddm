    date: "2026-10-05"
    claim: "The DisplayPort reference clock on unit A is 600.000 MHz, read from the hardware. `CLK4_0_CLK4_CLK2_CURRENT_CNT` (byte offset `0x6C9FC` by `regcalc` over `clk_11_0_1_offset.h`, 100 kHz units) reads `0x1770` = 6000 in three reads on an idle desktop under Windows. The `dcn` dump holds OTG0 and OTG1. OTG0 reads `OTG_CONTROL` `0x80011311`, master enable set. Its `OTG_H_TOTAL` field is 2079 (h_total 2080) and its `OTG_V_TOTAL` field 1234 (v_total 1235), the same values M86 read under Linux. OTG1 reads `OTG_CONTROL` `0x80000310`, master enable clear, with h_total, v_total and frame count 0, so the second timing generator is present and dark. A community board read the same counter at the same offset (dword index `0x1B27F`) and got the same 6000. That board was tracking a kernel audio defect with two causes. One was a nominal 730 MHz reference in the wrong clock manager. The other was a VBIOS spread-spectrum flag that this board's clock does not honour"
    status_text: "MEASURED (unit A, the community reading is a third-party report)"
    detail: "Two consequences, both already in the code. `driver/kmd/display_timing.h` takes the pixel clock from this counter, and refuses a zero rather than inheriting Linux's nominal 600 MHz fallback. A limit of two screens on this part follows from the timing-generator count, not from a driver defect. This part has two timing generators and four pipes. The `dcn` dump cannot show that count, because the escape's register table holds OTG0 and OTG1 only (`driver/kmd/gen_regs.py`). The count comes from the source: `third_party/linux-amdgpu/dcn_2_0_1_offset.h` defines `mmOTG0_*` and `mmOTG1_*` and no `mmOTG2_*` or `mmOTG3_*`, and `dcn201_resource.c` sets `num_timing_generator` 2 against `pipe_count` 4. Do not trust the VBIOS downspread flag. Upstream Linux now disables DisplayPort audio spread spectrum for Cyan Skillfish (`drm/amd: Disable DP audio spread spectrum for Cyan Skillfish`). Third-party source, facts only: `elektricM/amd-bc250-docs` at `954b706` (dual licence, documents and code), `docs/troubleshooting/audio.md`. Not shown here: the audio DTO registers, which are outside this build's `dcn` register table (wishlist row L38). Also not shown: what a second head or an MST hub does, and the counter under a mode change"
