    claim: "The firmware accepts a GFX clock below the 1000 MHz level that its power tables publish. In session 402 the thermal cap put the part at 800 MHz / VID 116 (820 mV) and at 900 MHz / VID 116. That session ran the Rise of the Tomb Raider DirectX 12 benchmark on kernel driver 0.7.205.1, `DpmMaxMHz` 1500. The SMU refused neither point. The clock readback stream holds 49 samples at 800 MHz and 4 at 900 MHz. The 800 MHz samples run from 81.875 to 87.750 C, mean 84.55 C. The 900 MHz samples read 81.500 to 81.750 C. The governor's own telemetry and summary lines report the same two points 22 and 2 times. Of those 24 lines, 22 read `want 1000 cap 800` and one `want 1200 cap 900`, all 23 with `throttle thermal-soft`. The last line reads `want 1100 cap 1100 throttle thermal-ramp`. The SMU readback was still 900 MHz there while the cap had already risen. GPU busy on the 24 lines runs from 90.3 to 100.0 %. The log holds no `sub-floor refused` line. So 1000 MHz is the lowest level the tables offer (M47) and amdgpu's own clamp (`CYAN_SKILLFISH_SCLK_MIN`). It is not a measured hardware floor"
    status_text: "MEASURED (n = 1 session, unit A)"
    detail: "The table stops at 800 MHz, so nothing lower was requested. Both points carry the floor's own VID 116. This session therefore shows neither the lowest clock the firmware accepts, nor a sub-floor clock at another voltage. Seven driver comments and two documents (`hardware.md`, `design/dpm.md`) said that the firmware had never run below 1000 MHz, and cited M47. M47 records only what the tables publish. Those nine places now state what M47 says and what this session measured. `bc250_dpm_subfloor_refused()` stays as insurance for a part that does refuse a sub-floor point"
    evidence: "[E52](../evidence/windows/2026-10-04-E52-dpm-subfloor-402/RESULT.md)"
    edges:
      - {"type": "uses", "to": "M47"}
