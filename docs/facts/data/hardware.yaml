  - id: M790
    status: HYPOTHESIS
    date: "2026-10-05"
    claim: "Reported by the community, not measured here. A board-level over-current protection hard-locks the whole BC-250 in a clock band. On 40-CU boards that band starts between about 1850 and 2200 MHz, and it catches every tested board at 2400 MHz. In that state the monitor goes to standby and the reset and power buttons do nothing. Only cutting AC recovers the board. The reporters call it a system-wide power limit and not GPU-specific. A higher CPU overclock lowers the GPU voltage threshold at which the board hard-locks. Defective CUs clock to 2600 MHz on their own. So the limit they report is global power or VRM, not clock capability"
    status_text: "HYPOTHESIS (three named reporters in one community guide, no log)"
    detail: "Source, facts only: `katzzero/bc250-unofficial-community-guide` at `ee8df94` (MIT), `01-hardware-specs.md` and `02-bios-and-firmware.md`. Our hard ceiling of 2000 MHz (`BC250_CLOCK_CEILING_MHZ`) lies inside the reported band, and the release default stops at 1500 MHz. That is the standing argument for the 1500 MHz cap, and for the smart-plug procedure before any run above it. Unit A has 24 CU and not 40, so where the band sits on our part is unknown. No experiment is planned to find its edge"
  - id: M791
    status: HYPOTHESIS
    date: "2026-10-05"
    claim: "Our SMU mailbox is the firmware's own queue 0, from a third-party static read of the firmware. Its descriptor table gives queue 0 the command, argument and response mailboxes at SMN `0x03B10A08`, `0x03B10A48` and `0x03B10A68`. The low 12 bits of those three addresses are `0xA08`, `0xA48` and `0xA68`. `regcalc` computes the byte offsets `0x58A08` for `mmMP1_SMN_C2PMSG_66`, `0x58A48` for `mmMP1_SMN_C2PMSG_82` and `0x58A68` for `mmMP1_SMN_C2PMSG_90`, whose low 12 bits are those same three values. Those are the three registers our transport uses, in the same three roles. All five messages we send have a non-zero handler entry in queue 0's table: `GetSmuVersion` `0x02`, `RequestGfxclk` `0x0E`, `GetGfxFrequency` `0x37`, `GetGfxVid` `0x38` and `ForceGfxVid` `0x3B`"
    status_text: "HYPOTHESIS (third-party disassembly, the offset match is checkable, their message names are not)"
    detail: "Sources, facts only, nothing copied. `bc250-collective/bc250_smu_oc` at `327014d` (MIT) gives the descriptor-table offsets. `bc250-collective/amd_smu_reverse_engineering` at `3f47768` (no LICENSE file, all rights reserved, read only) gives the handler addresses. Their message names are applied by index from AMD's own header. Their table therefore shows that a slot exists and has a handler, never what it does. Our rule stands: presence in a header does not authorize use (`hardware.md`). Our side of the match is `regcalc` over `mp_11_0_8_offset.h` and `driver/shim/bc250_smu.c`. The firmware images that the second repository ships stay outside our tree"
    edges:
      - {"type": "uses", "to": "M22"}
