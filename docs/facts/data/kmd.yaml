    claim: "On kernel driver 0.7.193.1 the graphics pipe sat idle 5.70-5.92 ms per frame at both the low and the high preset of The Witcher 3 at native 1920x1080, a cost that did not move when the rendering work per frame doubled (11.9 against 25.6 ms of pipeline time per frame; trials 313-316, `tools/win/gpu-timeline` point-samples of `GRBM_STATUS`). The cause: a submission that arrived while another process's job held VMID 1's current root was refused and retried on a relative `KeDelayExecutionThread(1 ms)`, which on Windows expires on a clock tick and lasted p50 4.2 ms and p90 5.6 ms at high, p50 2.3 ms and p90 14.2 ms at low, while readied-to-running was 0.04-0.06 ms; the compositor job that blocked it is 0.29 ms long and dxgkrnl asks for the game's next packet about 0.13 ms before that job's completion interrupt. Kernel driver 0.7.196.1 (`28b89a4c`, SYS `22FDE5B8`, registered 2026-10-02T20:05Z) replaces the sleep with a 500 us spin in 20 us steps and then a wait on the graphics retirement event with a 1 ms fallback. In the one pair that changes nothing but the kernel driver (314 against 318: shell `A27C9617`, engine `D4057452`, ICD `102D77EC`, high preset) 31.3 becomes 36.8 frames/s, +17.6 %, with idle 5.83 -> 1.18 ms per frame against a frame time 31.95 -> 27.17 ms, graphics idle 18.3 % -> 4.3 % of the window, and the pipeline time per frame unchanged (25.54 -> 25.46 ms). The driver's own counters show every hold resolved inside the spin: 10177 holds, mean 199 us, worst 618 us, 0 event and 0 timeout wakes (318); 17601 holds, mean 200 us, worst 810 us, the same (320). At low the rate rises about 9 % (54.3-54.8 to 59.6), but that pair does not hold the shell, engine and ICD identical and its rates carry the cost of the ETW kernel session itself"
