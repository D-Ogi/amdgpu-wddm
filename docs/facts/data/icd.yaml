    claim: "In `mul_mat_q<Q8_0, 8>` compiled for gfx1013, the RDNA1 inline-assembly branch of `ggml_cuda_dp4a` alone accounts for the whole difference the `RDNA1` macro makes to the kernel, and that difference is a cost: 2.2 times the instructions (1025 against 2292), 4.5 times the shared-memory reads (40 against 180 `ds_read2_b32`), 14 more vector registers (200 against 214) and 12288 more bytes of object. A third build of the same translation unit, with `RDNA1` defined and only that one branch condition renamed to a macro nothing defines (`common.cuh:717`), is equal to the unpatched build in every figure: 599168 object bytes, 1025 instructions, the whole instruction histogram, every field of the kernel descriptor, and the disassembly line for line. The cause is that the generic C loop already compiles to the same `v_mul_i32_i24_sdwa` plus `v_add3_u32` sequence, while the `asm` block is opaque to the compiler, so across the accumulators of one tile it blocks the common subexpression elimination of the byte extraction and the merging of the LDS reads"
