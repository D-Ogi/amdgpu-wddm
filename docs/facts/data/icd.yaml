    claim: "Two dependent compute dispatches of one indirect buffer may skip the level-2 and metadata cache operations on gfx1013, and doing so is faster. The light barrier `GL1_INV | GLV_INV | GLK_INV` in place of the full acquire gave `exact yes` over two separate chains of 1000 dependent kernels in one session (65536 items, each holding exactly 1000), and it is faster on both kernel measurements: 3.832 against 4.819 us a dispatch on the dependent line (20 % less, end to end 4.0 against 5.0 us) and 7.601 against 7.962 us on the independent line (4.5 % less), at the same dispatch cap of 32. Nothing else of the arm moved"
    status_text: "MEASURED (unit A, arm P3 against arm P2, plus arm P4 as the second exact chain)"
    detail: "This answers open question 4 of design section 8.5 for a buffer dependency on this part, and only for one. The bits it drops are GL2_INV, GL2_WB, GLM_INV, GLM_WB and GLI_INV, which `test_pm4` states to the dword with the dropped set as its negative control. The instruction cache invalidate stays at the head of every buffer, because a code object load is a flush point. It is not a general statement that level-2 is coherent on this part: it is two chains of one kernel shape writing and reading one buffer. radv decides the same question per barrier from the resources involved; we decide it once per buffer from a switch, which is the stated deviation from Linux"
