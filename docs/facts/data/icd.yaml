  - id: M856
    status: MEASURED
    date: "2026-10-09"
    claim: "What limits an indirect buffer of M16 route B to about 64 dispatches is the kernel argument pool of layer 2 and not the dword capacity of a command ring slot. At a dispatch cap of 256 with the time cap raised to 100000 us, unit A closed exactly 32 buffers for 2000 dispatches and exactly 16 for 1000 dependent dispatches, and the wait count of each of those measurements equals its submission count. `kKernargPoolMax` in `compute/hip/runtime/hip_launch.cpp` is 64, a kernel argument buffer cannot be written again until the dispatch that reads it has retired, and a wait for a value an open buffer has promised submits that buffer: ceil(2000/64) is 32 and ceil(1000/64) is 16. The dword cap is nowhere near that. One dispatch and its inter-dispatch barrier is 72 dwords (the golden stream of `tests/host/test_pm4.c`: 83 dwords for one dispatch alone, of which 11 are the buffer head and 8 the completion write), so the 16368 usable dwords of a 65536-byte slot hold about 227 of them, and 711 once a dispatch writes only the compute state that changed"
    status_text: "MEASURED (unit A, arms P4 and P4b, with the dword figures from the pure builder on the development machine)"
    detail: "The session's own write-up attributed the ceiling to the dwords and derived 262 dwords a dispatch from 16368/62.5. That figure is wrong: the builder is pure and its output is counted to the dword by a golden test, and 62.5 dispatches of 72 dwords is 4503 dwords, not a full slot. The consequences are that a cap of 32 is below the pool and the pool therefore never binds at the default, that a cap above 64 needs the pool raised with it at 4096 bytes of host-visible memory an entry, and that the dword cost is still worth cutting because the host writes it and the command processor reads it on every dispatch. Arm P4 closed 37 buffers and not 32, and those five extra are the 1000 us time cap expiring inside a 17.7 ms loop"
    evidence: "[M16 dispatch cost](../evidence/m16/perf-2026-10-09/README.md), [arm P4b](../evidence/m16/perf-2026-10-09/arm-05-p4b-hold100ms.txt)"
    edges:
      - {"type": "uses", "to": "M854"}
  - id: M857
    status: MEASURED
    date: "2026-10-09"
    claim: "Dispatch batching makes a 4 KB device-to-host `hipMemcpy` of M16 route B about 9.5 us slower on unit A, and the cause is not in the host path. The measurement is bimodal across six arms of one session: 19.246 and 19.396 us in the two unbatched arms, 28.816, 28.853, 28.866 and 28.906 us in the four batched ones. The same arms' 1 MiB device-to-host copies (4874 to 4910 us) and 64 MiB ones (360.1 to 360.4 ms) are equal to three digits, and host-to-device copies do not move (0.264 to 0.333 us at 4 KB). The unbatched 4 KB rate of 203.0 MiB/s equals the unbatched 1 MiB rate of 204.9, and the batched figure is 135 MiB/s, so the difference is a read rate of the mapping and not a fixed cost added to the call. The 512 waits of that measurement are answered by the fence mapping in both policies"
    status_text: "MEASURED (unit A, six arms of one session; the cause is NOT established)"
    detail: "The host path cannot hold it: a `hipMemcpy` of either direction waits for the device, looks the allocation up, flushes (which returns at once with no buffer open) and runs one `memcpy`, and the only difference between the two directions is which way that `memcpy` goes. The host-to-device line of the same arms bounds that shared path under one microsecond and it does not move with the policy, and `test_hip_batch` section 5 asserts the flush, submission and wait counts of a copy are equal under both policies. One state of the machine is perfectly bimodal with the figure in the session's logs, the GPU clock after each arm (1000 MHz after both unbatched arms, 500 MHz after all four batched ones), and it is not an explanation, because the 1 MiB and 64 MiB lines of the same arms would then differ too. Read as a trade the cost is repaid by the second dispatch after the copy, which saves 9 to 12 us. The arm that decides it is the same copy line with no kernel phase in front of it, in both policies"
    evidence: "[M16 dispatch cost](../evidence/m16/perf-2026-10-09/README.md), [measurements](../evidence/m16/perf-2026-10-09/measurements.jsonl)"
    edges:
      - {"type": "uses", "to": "M854"}
