    claim: "The Witcher 3 Remaster (D3D12) at HIGH with RT: the RT setting costs an estimated 76 % of the frame on unit A, a modelled incremental cost of the setting and not measured time inside the RT passes. With the kernel driver 0.7.216.20, D3D12 shell BBB5803E, engine 348117F1 and ICD 822134D0, 40 CU, native 1920x1080 exclusive fullscreen, FXAA, no upscaler, the measured present rates give, at a 1.5 GHz equivalent clock, a frame of 18.1 ms with RT off, 35.9 ms with RT GI Performance, 53.9 ms with GI and reflections, 52.7 ms with GI and shadows Performance, 44.5 ms with GI and AO, 76.4 ms with all four (13.1 frames/s), 69.9 ms with AO off (the game's high-rt preset, +8 % against the in-session control) and 85.5 ms with GI Quality (-11 %). The 76 % is (76.4 - 18.1) / 76.4 of those two modelled frame times under the fitted rate x (1.5 / GHz)^0.75, so it holds every other rendering change that the setting makes, denoising among them. The per-effect numbers (+18.0 ms for RT reflections, +16.8 ms for RT shadows Performance and +8.6 ms for RT AO on top of GI) are deltas between settings in different sessions, not measured pass durations, and the game's own reflections and shadows settings are the largest setting levers (about +31 % and +28 % each). One session with RADV_PERFTEST=cswave32 found no advantage that this normalisation can measure (13.2 frames/s at the same equivalent clock, the same as the control). The rate follows the shader clock with a fitted elasticity of about 0.75"
    status_text: "MEASURED (unit A, one session per arm, one in-game sweep session; the present rates are measured, and the frame times at 1.5 GHz, the 76 % and the per-effect costs are modelled under the fitted 0.75 clock exponent)"
    detail: "Sessions 469 to 476, 2026-10-07 23:36Z to 2026-10-08 01:36Z, Kaer Morhen room, still camera, GPU busy 98 to 100 % in every window. Arms 469 to 473 (all four, GI only, GI + reflections, GI + shadows, GI + AO) are one session each with a 90 s DxgKrnl window. 474 changed the settings in the game's menu and measured four 50 s windows: its all-four control A-ctl (13.2/s at 1500 MHz, 8.80/s per GHz) agrees with 469 (12.8/s at 1457 MHz, 8.79/s per GHz) within 0.8 % at the equivalent clock. 476 ran all four with cswave32: 12.6/s at 1416 MHz, 8.90/s per GHz, which the lower clock alone explains. The KMD thermal soft zone held 1100 to 1500 MHz at Tctl 78 to 85 C, so every rate is normalised as rate x (1.5 / GHz)^0.75. The exponent comes from 5 s slices inside the 474 windows (fits 0.74 to 0.77). M775 found that its build's HIGH + RT frame (9.3/s at 2000 MHz) did not follow the shader clock; on this stack it does, in part. Limits: one session per arm; the per-effect costs come from different sessions, which the A-ctl/469 match ties together; the reflection-off and shadow-off rates are sums of measured steps, not measured frames; rtwave64 was not run (trial 251 bugchecked 0x116 with it, and M795 records a wrong ray-query value under it); RADV has no BVH build-quality knob for gfx10. DWM (pid 8004) presented once per game frame in every window, so the exclusive fullscreen frames were composed. No GPU fault, TDR or removed device; every shot correct The evidence file RESULT.md names this fact M837, its number on main until the b23 train merge, where M837 already named the D3D12 state object fact (d3d.yaml), committed first. The game name was corrected on 2026-10-09 from 'next-gen' to 'Remaster': the lab has The Witcher 3 Remaster (its DX12 build), not a separate next-gen edition. Correction of 2026-10-10, from the independent audit of that day (finding A19): the row read 'spends 76 % of its frame in RT'. The series took no per-pass GPU timestamp, so that share is not time inside the RT passes. It is the difference of two frame times that the clock model produced, (76.4 - 18.1) / 76.4, and the 0.75 exponent is fitted to 5 s slices of the same thermal-governor data and not to a fixed-clock arm. The share is therefore an estimate of what the setting adds under that model, and it carries the shader, BVH and denoising work together. The same qualification covers 'three traced passes of 17 to 18 ms each' in the evidence Next steps: those are differences between settings. The cswave32 arm is one session under this normalisation, not a general null result. Because evidence/ is immutable, the evidence directory carries a dated CORRECTION.md instead of an edit. A fixed-clock repeated arm, or per-dispatch GPU timing, can test the attribution; neither is needed for the wording."
