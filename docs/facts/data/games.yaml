    claim: "At the same shader clock the installed Windows release b19 (0.7.208.100-tester.13, kernel driver 0.7.208.1 ABI 0x000700D0, the system Vulkan ICD CF3948D6, which is Mesa fork 2732f9c8 on amdgpu-wddm/gdi-immediate-quiet) runs llama.cpp faster than the Linux reference M52 on the same unit. TinyLlama 1.1B Q4_0, pp512 and tg128: at 1000 MHz 1813.1 and 1812.6 t/s prompt against Linux 1119.59 (+62 %) and 203.0 and 202.1 t/s generation against 154.92 (+30 to 31 %), at the release default ceiling of 1500 MHz 2659.7 and 2651.3 against 1657.11 (+60 to 61 %) and 260.0 and 270.8 against 219.38 (+19 to 23 %). The same 1000 MHz point is 62 % faster on prompt and 76 to 77 % faster on generation than the Windows numbers of 2026-09-24 (M415: 1115.94 and 114.56 at a fixed 1000 MHz with a per-process ICD), so the Windows generation deficit that M164, M166, M255, M274 and M321 recorded for their builds no longer holds for this stack"
    status_text: "MEASURED (n = 2 runs per clock, r3 each, one lab session)"
    detail: "Four runs between 18:32Z and 18:45Z on unit A, release installed, no game and no other trial, overlay summary poll paused. Same llama-bench build as the Linux reference (3b3da01dc, 9564), same two models and same arguments (-ngl 99 -p 512 -n 128 -r 3 -t 6), MESA_SHADER_CACHE_DISABLE=true, each run started as a scheduled task in the interactive session through headless conhost. The loader witness in every error log names the system ICD, so no per-process ICD was in play. The clock came from the KMD governor under the DpmMaxMHz ceiling, which the lab took from a registry value and a restart. Per-second governor samples: the two 1000 MHz runs held the ceiling at `cap 1000 max 1000`, and every sample at 40 % busy or more read 1000 MHz 820 mV. The 500 MHz idle state still appears while busy reads 3 to 10 %: at the stories15M tests of both runs, whose GPU work is a few milliseconds, and twice in the tail of the second run. The TinyLlama tests of both 1000 MHz runs sit inside samples that read 1000 MHz. The second 1500 MHz run read 1500 MHz 919 mV on its busy samples. Tctl max 70.6 C. Limits: Mesa differs between the two sides (our fork of Mesa main 26.3-devel with the WDDM winsys against Alpine stock Mesa 26.1.6 under Linux), the Linux reference is of 2026-09-21 and was not repeated, the Linux build also had a CPU BLAS backend registered, the 1500 MHz leg mixes clocks because the governor ramps through 1000 MHz and is therefore a lower bound, the first run lost its governor samples, stories15M is dispatch overhead and noise (stddev up to 24 % of the mean, the prompt rate does not follow the clock) and compares with nothing, no power was measured and these runs carry no CU witness"
