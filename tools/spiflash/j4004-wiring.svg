<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1010" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="1010" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1a202c">BIOS flash read through J4004: 5 wires, no VCC</text>
  <text x="550" y="70" text-anchor="middle" font-size="15" fill="#4a5568">Chip MX25L12873F (3.3 V). PSU on, unit A off (S5 standby): the board powers the chip, not the programmer.</text>

  <!-- Panel A: CH341A -->
  <text x="60" y="112" font-size="17" font-weight="700" fill="#1a202c">A. CH341A: 7-pin side header (legend on the board underside: 5V, 3.3V, GND, MISO, MOSI, CS, CLK)</text>

  <!-- board -->
  <rect x="690" y="125" width="370" height="375" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/>
  <text x="875" y="490" text-anchor="middle" font-size="13" fill="#276749">BC-250 board, J4004 (top view)</text>

  <!-- wires (halo first) -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <g stroke="#ffffff" stroke-width="10">
      <polyline points="330,150 908,150 908,250"/>
      <polyline points="330,190 828,190 828,250"/>
      <polyline points="330,230 748,230 748,250"/>
      <polyline points="330,420 828,420 828,386"/>
      <polyline points="330,465 908,465 908,386"/>
    </g>
    <polyline points="330,150 908,150 908,250" stroke="#2b6cb0" stroke-width="5"/>
    <polyline points="330,190 828,190 828,250" stroke="#d69e2e" stroke-width="5"/>
    <polyline points="330,230 748,230 748,250" stroke="#1a1a1a" stroke-width="5"/>
    <polyline points="330,420 828,420 828,386" stroke="#805ad5" stroke-width="5"/>
    <polyline points="330,465 908,465 908,386" stroke="#2f855a" stroke-width="5"/>
  </g>

  <!-- programmer side boxes -->
  <g font-size="15">
    <rect x="60" y="133" width="270" height="34" rx="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="74" y="156" fill="#1a202c"><tspan font-weight="700">MOSI</tspan></text>
    <rect x="60" y="173" width="270" height="34" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="2"/>
    <text x="74" y="196" fill="#1a202c"><tspan font-weight="700">CLK</tspan> (square pad)</text>
    <rect x="60" y="213" width="270" height="34" rx="6" fill="#edf2f7" stroke="#1a1a1a" stroke-width="2"/>
    <text x="74" y="236" fill="#1a202c"><tspan font-weight="700">GND</tspan></text>
    <rect x="60" y="403" width="270" height="34" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="2"/>
    <text x="74" y="426" fill="#1a202c"><tspan font-weight="700">CS</tspan></text>
    <rect x="60" y="448" width="270" height="34" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
    <text x="74" y="471" fill="#1a202c"><tspan font-weight="700">MISO</tspan></text>

    <rect x="60" y="275" width="270" height="105" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="74" y="300" fill="#718096" font-weight="700">do not connect:</text>
    <text x="74" y="324" fill="#718096">5V</text>
    <text x="74" y="346" fill="#718096">3.3V</text>
    <text x="74" y="368" fill="#718096">(ZIF socket empty)</text>
  </g>

  <!-- J4004 pins: top row 5 6 7 8, bottom row 1 2 3 (4 missing) -->
  <g text-anchor="middle">
    <rect x="720" y="250" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="748" y="275" font-size="18" font-weight="700" fill="#fff">5</text>
    <text x="748" y="295" font-size="12" fill="#fff">GND</text>
    <rect x="800" y="250" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="828" y="275" font-size="18" font-weight="700" fill="#fff">6</text>
    <text x="828" y="295" font-size="12" fill="#fff">CLK</text>
    <rect x="880" y="250" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="908" y="275" font-size="18" font-weight="700" fill="#fff">7</text>
    <text x="908" y="295" font-size="12" fill="#fff">MOSI</text>
    <rect x="960" y="250" width="56" height="56" rx="4" fill="#cbd5e0"/>
    <text x="988" y="275" font-size="18" font-weight="700" fill="#4a5568">8</text>
    <text x="988" y="295" font-size="12" fill="#4a5568">✕ open</text>

    <rect x="720" y="330" width="56" height="56" rx="4" fill="#cbd5e0" stroke="#c53030" stroke-width="3"/>
    <text x="748" y="355" font-size="18" font-weight="700" fill="#4a5568">1</text>
    <text x="748" y="375" font-size="12" fill="#c53030">✕ VCC</text>
    <rect x="800" y="330" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="828" y="355" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="828" y="375" font-size="12" fill="#fff">CS</text>
    <rect x="880" y="330" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="908" y="355" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="908" y="375" font-size="12" fill="#fff">MISO</text>
    <rect x="960" y="330" width="56" height="56" rx="4" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="988" y="355" font-size="16" fill="#718096">4</text>
    <text x="988" y="375" font-size="11" fill="#718096">no pin</text>

    <polygon points="736,410 760,410 748,393" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
    <text x="770" y="406" text-anchor="start" font-size="12" fill="#1a202c">white triangle = pin 1</text>
  </g>

  <!-- Panel B: Pico H -->
  <line x1="60" y1="528" x2="1040" y2="528" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="562" font-size="17" font-weight="700" fill="#1a202c">B. Alternative: Pico H, libreboot pico-serprog only (CS on GP5), drawing: j4004-pico-h-wiring.svg</text>
  <g font-size="15">
    <rect x="60" y="580" width="16" height="16" fill="#d69e2e"/><text x="88" y="594">GP2 (physical pin 4) · CLK  →  J4004 pin 6</text>
    <rect x="60" y="610" width="16" height="16" fill="#2b6cb0"/><text x="88" y="624">GP3 (physical pin 5) · MOSI  →  J4004 pin 7</text>
    <rect x="60" y="640" width="16" height="16" fill="#2f855a"/><text x="88" y="654">GP4 (physical pin 6) · MISO  →  J4004 pin 3</text>
    <rect x="60" y="670" width="16" height="16" fill="#805ad5"/><text x="88" y="684">GP5 (physical pin 7) · CS  →  J4004 pin 2</text>
    <rect x="60" y="700" width="16" height="16" fill="#1a1a1a"/><text x="88" y="714">GND (physical pin 3)  →  J4004 pin 5</text>
    <text x="600" y="594" fill="#4a5568">Pico physical pins counted from the USB corner,</text>
    <text x="600" y="616" fill="#4a5568">left edge: 1, 2, 3 (GND), 4, 5, 6, 7...</text>
    <text x="600" y="638" fill="#4a5568">Pico 3V3 and VBUS stay open.</text>
  </g>

  <!-- Notes -->
  <line x1="60" y1="742" x2="1040" y2="742" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="774" font-size="17" font-weight="700" fill="#c53030">Rules</text>
  <g font-size="15" fill="#1a202c">
    <text x="60" y="802">1. J4004 pin 1 (VCC) and pin 8: never connect. Pin 4 does not exist (empty pad).</text>
    <text x="60" y="830">2. Do NOT plug the clip ribbon onto J4004: other pin order, VCC can short to GND.</text>
    <text x="60" y="858">3. Both ends are male pins (CH341A header and J4004), so use female-female (F-F) wires.</text>
    <text x="80" y="880">CH341A 5V and 3.3V stay open (3.3V only for the optional 10k MISO pull-up); ZIF socket empty.</text>
    <text x="60" y="908">4. Order: programmer on USB first, then the wires (an unpowered CH341A is fed through its inputs).</text>
    <text x="60" y="936">5. Unit A in S5, PSU on. spi_read.ps1 makes three reads and compares the hashes.</text>
    <text x="60" y="970" font-size="12" fill="#718096">J4004 pinout: project-ariel bc250_manual.md; agrees with unit A (no pin at position 4) and with a working read.</text>
  </g>
</svg>
