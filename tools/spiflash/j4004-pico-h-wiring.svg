<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1080" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="1080" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1a202c">BIOS flash read through J4004 with a Pico H: 5 wires, no VCC</text>
  <text x="550" y="70" text-anchor="middle" font-size="15" fill="#4a5568">Chip MX25L12873F (3.3 V). PSU on, unit A off (S5 standby): the board powers the chip, not the Pico.</text>
  <text x="550" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#c53030">Firmware: pico-serprog, libreboot variant (CS on GP5). NOT for the stacksmashing variant (CS on GP1).</text>

  <!-- board -->
  <rect x="690" y="125" width="370" height="375" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/>
  <text x="875" y="490" text-anchor="middle" font-size="13" fill="#276749">BC-250 board, J4004 (top view)</text>

  <!-- Pico H, header side facing the reader, USB end at the top. -->
  <rect x="120" y="125" width="210" height="375" rx="10" fill="#e9f5ee" stroke="#2f855a" stroke-width="2"/>
  <rect x="193" y="113" width="64" height="21" rx="4" fill="#a0aec0" stroke="#4a5568" stroke-width="1.5"/>
  <text x="225" y="128" text-anchor="middle" font-size="12" fill="#1a202c">USB</text>
  <text x="225" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#276749">Pico H, underside / header side</text>
  <text x="225" y="545" text-anchor="middle" font-size="12" fill="#4a5568">USB end shown. Pin 1 is at the upper right.</text>

  <!-- wires: each wire has its own white halo, so a later wire breaks an earlier one at a crossing -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="330,353 535,353 535,441 842,441 842,396" stroke="#ffffff" stroke-width="10"/>
    <polyline points="330,353 535,353 535,441 842,441 842,396" stroke="#805ad5" stroke-width="5"/>
    <polyline points="330,319 908,319 908,340" stroke="#ffffff" stroke-width="10"/>
    <polyline points="330,319 908,319 908,340" stroke="#2f855a" stroke-width="5"/>
    <polyline points="330,285 908,285 908,236" stroke="#ffffff" stroke-width="10"/>
    <polyline points="330,285 908,285 908,236" stroke="#2b6cb0" stroke-width="5"/>
    <polyline points="330,251 828,251 828,236" stroke="#ffffff" stroke-width="10"/>
    <polyline points="330,251 828,251 828,236" stroke="#d69e2e" stroke-width="5"/>
    <polyline points="330,217 720,217" stroke="#ffffff" stroke-width="10"/>
    <polyline points="330,217 720,217" stroke="#1a1a1a" stroke-width="5"/>
  </g>

  <!-- Underside, USB up: pins 1 through 10 run down the right edge. -->
  <g font-size="13">
    <rect x="304" y="137" width="24" height="24" fill="#cbd5e0" stroke="#718096"/><text x="296" y="154" text-anchor="end" fill="#718096">1 · GP0</text>
    <rect x="304" y="171" width="24" height="24" fill="#cbd5e0" stroke="#c53030" stroke-width="2.5"/><text x="296" y="188" text-anchor="end" fill="#c53030">2 · GP1 open</text>
    <rect x="304" y="205" width="24" height="24" fill="#1a1a1a"/><text x="296" y="222" text-anchor="end" font-weight="700" fill="#1a202c">3 · GND</text>
    <rect x="304" y="239" width="24" height="24" fill="#d69e2e"/><text x="296" y="256" text-anchor="end" font-weight="700" fill="#1a202c">4 · GP2 CLK</text>
    <rect x="304" y="273" width="24" height="24" fill="#2b6cb0"/><text x="296" y="290" text-anchor="end" font-weight="700" fill="#1a202c">5 · GP3 MOSI</text>
    <rect x="304" y="307" width="24" height="24" fill="#2f855a"/><text x="296" y="324" text-anchor="end" font-weight="700" fill="#1a202c">6 · GP4 MISO</text>
    <rect x="304" y="341" width="24" height="24" fill="#805ad5"/><text x="296" y="358" text-anchor="end" font-weight="700" fill="#1a202c">7 · GP5 CS</text>
    <rect x="304" y="375" width="24" height="24" fill="#cbd5e0" stroke="#718096"/><text x="296" y="392" text-anchor="end" fill="#718096">8 · GND</text>
    <rect x="304" y="409" width="24" height="24" fill="#cbd5e0" stroke="#718096"/><text x="296" y="426" text-anchor="end" fill="#718096">9 · GP6</text>
    <rect x="304" y="443" width="24" height="24" fill="#cbd5e0" stroke="#718096"/><text x="296" y="460" text-anchor="end" fill="#718096">10</text>
    <!-- the other column: pins 40 to 31, all open -->
    <rect x="122" y="137" width="24" height="24" fill="#cbd5e0" stroke="#c53030" stroke-width="2.5"/><text x="152" y="154" fill="#c53030">40 VBUS</text>
    <rect x="122" y="171" width="24" height="24" fill="#cbd5e0" stroke="#c53030" stroke-width="2.5"/><text x="152" y="188" fill="#c53030">39 VSYS</text>
    <rect x="122" y="205" width="24" height="24" fill="#cbd5e0" stroke="#718096"/>
    <rect x="122" y="239" width="24" height="24" fill="#cbd5e0" stroke="#718096"/>
    <rect x="122" y="273" width="24" height="24" fill="#cbd5e0" stroke="#c53030" stroke-width="2.5"/><text x="152" y="290" fill="#c53030">36 3V3</text>
    <rect x="122" y="307" width="24" height="24" fill="#cbd5e0" stroke="#718096"/>
    <rect x="122" y="341" width="24" height="24" fill="#cbd5e0" stroke="#718096"/>
    <rect x="122" y="375" width="24" height="24" fill="#cbd5e0" stroke="#718096"/>
    <rect x="122" y="409" width="24" height="24" fill="#cbd5e0" stroke="#718096"/>
    <rect x="122" y="443" width="24" height="24" fill="#cbd5e0" stroke="#718096"/>
  </g>

  <!-- J4004 pins: top row 5 6 7 8, bottom row 1 2 3 (4 missing) -->
  <g text-anchor="middle">
    <rect x="720" y="180" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="748" y="205" font-size="18" font-weight="700" fill="#fff">5</text>
    <text x="748" y="225" font-size="12" fill="#fff">GND</text>
    <rect x="800" y="180" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="828" y="205" font-size="18" font-weight="700" fill="#fff">6</text>
    <text x="828" y="225" font-size="12" fill="#fff">CLK</text>
    <rect x="880" y="180" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="908" y="205" font-size="18" font-weight="700" fill="#fff">7</text>
    <text x="908" y="225" font-size="12" fill="#fff">MOSI</text>
    <rect x="960" y="180" width="56" height="56" rx="4" fill="#cbd5e0"/>
    <text x="988" y="205" font-size="18" font-weight="700" fill="#4a5568">8</text>
    <text x="988" y="225" font-size="12" fill="#4a5568">✕ open</text>

    <rect x="720" y="340" width="56" height="56" rx="4" fill="#cbd5e0" stroke="#c53030" stroke-width="3"/>
    <text x="748" y="365" font-size="18" font-weight="700" fill="#4a5568">1</text>
    <text x="748" y="385" font-size="12" fill="#c53030">✕ VCC</text>
    <rect x="800" y="340" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="828" y="365" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="828" y="385" font-size="12" fill="#fff">CS</text>
    <rect x="880" y="340" width="56" height="56" rx="4" fill="#2d3748"/>
    <text x="908" y="365" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="908" y="385" font-size="12" fill="#fff">MISO</text>
    <rect x="960" y="340" width="56" height="56" rx="4" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="988" y="365" font-size="16" fill="#718096">4</text>
    <text x="988" y="385" font-size="11" fill="#718096">no pin</text>

    <polygon points="736,420 760,420 748,403" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
    <text x="768" y="416" text-anchor="start" font-size="12" fill="#1a202c">= pin 1</text>
  </g>

  <!-- Wire list -->
  <line x1="60" y1="556" x2="1040" y2="556" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="588" font-size="17" font-weight="700" fill="#1a202c">Wire list (same colours as the CH341A drawing)</text>
  <g font-size="15">
    <rect x="60" y="604" width="16" height="16" fill="#d69e2e"/><text x="88" y="618">Pico pin 4 · GP2 · CLK  →  J4004 pin 6</text>
    <rect x="60" y="632" width="16" height="16" fill="#2b6cb0"/><text x="88" y="646">Pico pin 5 · GP3 · MOSI  →  J4004 pin 7</text>
    <rect x="60" y="660" width="16" height="16" fill="#2f855a"/><text x="88" y="674">Pico pin 6 · GP4 · MISO  →  J4004 pin 3</text>
    <rect x="60" y="688" width="16" height="16" fill="#805ad5"/><text x="88" y="702">Pico pin 7 · GP5 · CS  →  J4004 pin 2</text>
    <rect x="60" y="716" width="16" height="16" fill="#1a1a1a"/><text x="88" y="730">Pico pin 3 · GND  →  J4004 pin 5</text>
    <text x="560" y="618" fill="#1a202c" font-weight="700">Match the side shown before attaching the leads.</text>
    <text x="560" y="646" fill="#4a5568">Turn the Pico H with the printed GP labels and the</text>
    <text x="560" y="668" fill="#4a5568">header pins toward you. Keep the USB end up.</text>
    <text x="560" y="696" fill="#4a5568">On the right edge, count down from pin 1 (GP0).</text>
    <text x="560" y="718" fill="#4a5568">The five leads occupy physical pins 3 through 7.</text>
  </g>

  <!-- Rules -->
  <line x1="60" y1="756" x2="1040" y2="756" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="788" font-size="17" font-weight="700" fill="#c53030">Rules</text>
  <g font-size="15" fill="#1a202c">
    <text x="60" y="816">1. J4004 pin 1 (VCC) and pin 8: never connect. Pin 4 does not exist (empty pad).</text>
    <text x="60" y="844">2. Pico pins 36 (3V3), 39 (VSYS) and 40 (VBUS) stay open. Pico pin 2 (GP1) stays open: it is the CS of the other firmware.</text>
    <text x="60" y="872">3. Wires only while unit A does not run (S5, PSU on). Remove all five wires before a start.</text>
    <text x="60" y="900">4. Order: Pico on USB first, then the wires. Remove the wires before the USB cable (an unpowered Pico is fed through its pins).</text>
    <text x="60" y="928">5. Female-female (F-F) wires, short. Do NOT plug a clip ribbon onto J4004: other pin order, VCC can short to GND.</text>
    <text x="60" y="956">6. Status 2026-11-18: reads repeatable (3 equal). Write not tried. Windows host: mode COMn dtr=on before flashrom.</text>
    <text x="80" y="978">The CH341A stays the programmer for every write and restore until that comparison is equal.</text>
    <text x="60" y="1012" font-size="12" fill="#718096">Pin map: libreboot pico-serprog main.c lines 24-27 (SPI_CS_0 5, SPI_MISO 4, SPI_MOSI 3, SPI_SCK 2), codeberg.org/libreboot/pico-serprog, branch main, read 2026-11-18.</text>
    <text x="60" y="1030" font-size="12" fill="#718096">Other variant: stacksmashing/pico-serprog main.c lines 22-25 (PIN_CS 1, PIN_SCK 2, PIN_MOSI 3, PIN_MISO 4). Check which UF2 is on the Pico before you wire CS.</text>
    <text x="60" y="1048" font-size="12" fill="#718096">GP to physical pin: Raspberry Pi Pico pinout (GP1 pin 2, GND pin 3, GP2 pin 4, GP3 pin 5, GP4 pin 6, GP5 pin 7). J4004 pinout: as in j4004-wiring.svg.</text>
  </g>
</svg>
