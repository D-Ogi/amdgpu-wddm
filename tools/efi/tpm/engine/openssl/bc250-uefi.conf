# The OpenSSL Configure target of the BC-250 stage. build.ps1 gives it to Configure with --config.
#
# It is the UEFI-x86_64 target of OpenSSL with two changes:
# - The objects are made by the clang of the stage for x86_64-unknown-windows (build.ps1 gives CC and CFLAGS).
# - No assembly. The perlasm "nasm" scheme of UEFI-x86_64 needs nasm, and the first build is C only.
#
# The UEFI target does not read crypto/bn_conf.h. The word size of the big numbers (SIXTY_FOUR_BIT) and the
# UEFI base types come from tpm/engine/ossl_platform.h, which build.ps1 includes in each OpenSSL and libtpms object.

my %targets = (
    "BC250-UEFI-x86_64" => {
        inherit_from     => [ "UEFI-x86_64" ],
        asm_arch         => undef,
        perlasm_scheme   => undef,
        bn_ops           => "SIXTY_FOUR_BIT",
    },
);
