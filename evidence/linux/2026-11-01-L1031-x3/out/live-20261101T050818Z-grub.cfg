set timeout=5
set default=6
set fallback=4
# X3 (2026-11-01): with default=6 (Windows through bootmgfw.efi) every start counts in grubenv; Windows clears the
# count 3 minutes after a good start (task "Lab boot counter reset"). After three Windows starts without that clear,
# GRUB boots entry 4 (network only) so the lab can be repaired over SSH. Steering still edits "set default=".
if [ -z "${stick}" ]; then set stick=${root}; fi
if [ "${default}" = "6" ]; then
  load_env --file (${stick})/boot/grub/grubenv bc250_try
  if [ -z "${bc250_try}" ]; then
    set bc250_try=1
  elif [ "${bc250_try}" = "1" ]; then
    set bc250_try=2
  elif [ "${bc250_try}" = "2" ]; then
    set bc250_try=3
  else
    set default=4
    echo "X3: three Windows starts without a clear; booting the network-only Linux entry"
  fi
  save_env --file (${stick})/boot/grub/grubenv bc250_try
fi

menuentry "BC-250 diagnostics: full (raw probe, then load amdgpu)" {
linux	/boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage modprobe.blacklist=amdgpu bc250.mode=full
initrd	/boot/initramfs-lts
}

menuentry "BC-250 diagnostics: raw probe only (amdgpu is never loaded)" {
linux	/boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage modprobe.blacklist=amdgpu bc250.mode=noload
initrd	/boot/initramfs-lts
}

menuentry "BC-250 diagnostics: strictly read-only raw probe (no MMIO writes, no amdgpu)" {
linux	/boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage modprobe.blacklist=amdgpu bc250.mode=readonly
initrd	/boot/initramfs-lts
}

menuentry "Alpine Linux shell only (no diagnostics)" {
linux	/boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage modprobe.blacklist=amdgpu bc250.mode=off
initrd	/boot/initramfs-lts
}

menuentry "BC-250 reference: network only, no GPU probe" {
linux /boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage modprobe.blacklist=amdgpu bc250.mode=network
initrd /boot/initramfs-lts
}

menuentry "HOST SSD O: automatic read-only speed test" {
linux /boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage modprobe.blacklist=amdgpu bc250.mode=off nvme.read=1
initrd /boot/initramfs-lts
}

menuentry "Windows (NVMe bootmgfw.efi, X3 start counter)" {
  search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
  chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
