set fallback=4
# X3 (2026-11-01): with default=6 (Windows through bootmgfw.efi) every start counts in grubenv; Windows clears the
# count 3 minutes after a good start (task "Lab boot counter reset"). After three Windows starts without that clear,
# GRUB boots entry 4 (network only) so the lab can be repaired over SSH. Steering still edits "set default=".
if [ -z "${stick}" ]; then set stick=${root}; fi
if [ "${default}" = "6" ]; then
  load_env --file (${stick})/boot/grub/grubenv bc250_try
  if [ -z "${bc250_try}" ]; then
    set bc250_try=1
  elif [ "${bc250_try}" = "1" ]; then
    set bc250_try=2
  elif [ "${bc250_try}" = "2" ]; then
    set bc250_try=3
  else
    set default=4
    echo "X3: three Windows starts without a clear; booting the network-only Linux entry"
  fi
  save_env --file (${stick})/boot/grub/grubenv bc250_try
fi
