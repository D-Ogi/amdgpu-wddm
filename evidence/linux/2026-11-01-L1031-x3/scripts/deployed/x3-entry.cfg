
menuentry "Windows (NVMe bootmgfw.efi, X3 start counter)" {
  # root is the Windows ESP only while chainloader builds the image device path (bootmgfw finds its BCD
  # through it); it returns to the USB at once, because fallback entry 4 has paths relative to the USB.
  unset win_esp
  if search --no-floppy --file --set=win_esp /EFI/Microsoft/Boot/bootmgfw.efi; then
    set root=${win_esp}
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    set root=${stick}
  else
    echo "X3: Windows loader not found; using fallback entry 4"
    false
  fi
}
