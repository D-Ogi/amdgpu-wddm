set fallback=4
# X3: three default-Windows attempts without a verified health acknowledgement.
# Config evaluation consumes an attempt, including manual selection of another entry.
# Missing, corrupt or unwritable grubenv must choose network-only Linux.
if [ -z "${stick}" ]; then set stick=${root}; fi
if [ "${default}" = "6" ]; then
  unset bc250_try
  if load_env --file (${stick})/boot/grub/grubenv bc250_try; then
    if [ -z "${bc250_try}" ]; then
      set bc250_try=1
    elif [ "${bc250_try}" = "1" ]; then
      set bc250_try=2
    elif [ "${bc250_try}" = "2" ]; then
      set bc250_try=3
    else
      set default=4
      echo "X3: attempt limit or invalid counter; booting network-only Linux"
    fi
    if [ "${default}" = "6" ]; then
      if save_env --file (${stick})/boot/grub/grubenv bc250_try; then
        echo "X3: recorded Windows attempt ${bc250_try}"
      else
        set default=4
        echo "X3: cannot persist counter; booting network-only Linux"
      fi
    fi
  else
    set default=4
    echo "X3: cannot read counter; booting network-only Linux"
  fi
fi
